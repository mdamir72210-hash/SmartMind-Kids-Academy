name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.json
          echo '{"appId":"com.smartmind.kidsacademy","appName":"SmartMind Kids Academy","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartMindKidsAcademy-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
