name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.json
          echo '{"appId":"com.smartmind.kidsacademy","appName":"SmartMind Kids Academy","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          mkdir -p assets
          cp icon_512x512.png assets/icon-only.png
          cp icon_512x512.png assets/icon-foreground.png
          cp icon_512x512.png assets/icon-background.png
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Fix Kotlin Duplicate Class Conflict
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartMindKidsAcademy-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
